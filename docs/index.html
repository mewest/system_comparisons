<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Origin Latency</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@3/plotly.min.js"></script>
<style>
  :root { --fg:#1a1a1a; --muted:#666; --line:#d0d0d0; --bg:#fff; --panel:#f6f6f6; --accent:#1f4fbf; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:"Helvetica Neue","TeX Gyre Heros",Helvetica,Arial,sans-serif; font-size:16px; }
  header { padding:20px 24px 8px; }
  h1 { margin:0 0 4px; font-size:24px; font-weight:600; }
  .meta { color:var(--muted); font-size:14px; }
  .systems { display:flex; gap:8px; padding:8px 24px 0; flex-wrap:wrap; }
  .systems label { border:1px solid var(--line); border-radius:6px; padding:8px 16px; cursor:pointer;
                   font-size:16px; user-select:none; }
  .systems input { position:absolute; opacity:0; pointer-events:none; }
  .systems input:checked + span { font-weight:600; color:var(--accent); }
  .systems label:has(input:checked) { border-color:var(--accent); background:#eef3ff; }
  .systems label:has(input:focus-visible) { outline:2px solid var(--accent); outline-offset:2px; }
  main { display:flex; gap:16px; padding:12px 24px 24px; align-items:flex-start; }
  .plot { flex:1 1 auto; min-width:0; height:640px; }
  aside { flex:0 0 340px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  aside h2 { margin:0 0 10px; font-size:18px; }
  aside .hint { color:var(--muted); font-size:14px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0; font-size:14px; }
  dt { color:var(--muted); }
  dd { margin:0; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  aside a { color:var(--accent); }
  ul.links { list-style:none; padding:0; margin:12px 0 0; font-size:14px; }
  ul.links li { padding:2px 0; font-variant-numeric:tabular-nums; }
  ul.links li.self { font-weight:600; }
  .error { color:#b00020; padding:4px 24px; }
  section { border-top:1px solid var(--line); padding-top:12px; }
  section h2.sec { margin:0; padding:4px 24px 0; font-size:20px; font-weight:600; }
  @media (max-width: 860px) {
    main { flex-direction:column; padding:12px 16px 24px; }
    header, .systems, .error { padding-left:16px; padding-right:16px; }
    aside { flex:none; width:100%; }
    .plot { width:100%; height:540px; }
    section h2.sec { padding-left:16px; }
  }
</style>
</head>
<body>
<header>
  <h1>First Origin Latency</h1>
  <div class="meta" id="meta">Loading…</div>
</header>
<template id="section-tpl">
  <section>
    <h2 class="sec"></h2>
    <div class="systems" role="radiogroup" aria-label="SeisComP system">
      <label><input type="radio" value="onsite" checked><span>onsite</span></label>
      <label><input type="radio" value="offsite"><span>offsite</span></label>
      <label><input type="radio" value="dev"><span>dev</span></label>
    </div>
    <div class="error" hidden></div>
    <main>
      <div class="plot"></div>
      <aside></aside>
    </main>
  </section>
</template>
<div id="sections"></div>
<script>
// Classes and symbols match the PNG figures (scripts/plots.py).
const CLASSES = [
  {key:"auto_reject",  name:"rejected (auto)",    symbol:"x-thin-open",     color:"firebrick"},
  {key:"man_reject",   name:"rejected (manual)",  symbol:"x",               color:"firebrick"},
  {key:"auto_uneval",  name:"not evaluated",      symbol:"cross-thin-open", color:"black"},
  {key:"auto_confirm", name:"confirmed (auto)",   symbol:"circle-open",     color:"forestgreen"},
  {key:"man_confirm",  name:"confirmed (manual)", symbol:"circle-open",     color:"mediumblue"},
];
const CLIP = 3600, CLIP_Y = 4200;            // > 60 min drawn in the 60+ band, as in the PNG
const HINT = '<h2>Event</h2><p class="hint">Click a symbol to see its details. Click legend entries to hide or show a class.</p>';
const magSize = m => Math.min(30, Math.max(4, 3 * (m ?? 0) + 3));

// One entry per plot section; each has its own system buttons and event panel.
const PLOTS = [
  {title: "First Origin Latency", heading: "First origin latency vs time",
   x: e => e.time, size: e => magSize(e.mag), xaxis: {title: {text: "Origin time (UTC)"}}},
  {title: "First Origin Latency vs Magnitude", heading: "First origin latency vs magnitude",
   x: e => e.mag, size: () => 9, xaxis: {title: {text: "Magnitude"}}},
];

const cache = {};
const fmtLat = s => s == null ? "–" : s < 120 ? `${s.toFixed(1)} s` : `${(s / 60).toFixed(1)} min (${Math.round(s)} s)`;
const esc = s => String(s ?? "–").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load(sys) {
  if (!cache[sys]) {
    const r = await fetch(`data/${sys}.json`, {cache: "no-store"});
    if (!r.ok) throw new Error(`data/${sys}.json: HTTP ${r.status}`);
    const d = await r.json();
    d.events.forEach(e => e.t = Date.parse(e.time));
    d.sorted = d.events.filter(e => e.class).sort((a, b) => b.t - a.t);   // latest first
    cache[sys] = d;
  }
  return cache[sys];
}

function traces(p, events) {
  return CLASSES.map(c => {
    const ev = events.filter(e => e.class === c.key);
    return {
      type: "scattergl", mode: "markers", name: `${c.name} = ${ev.length}`,
      x: ev.map(p.x), y: ev.map(e => e.latency_s > CLIP ? CLIP_Y : e.latency_s),
      customdata: ev, hovertemplate: "%{customdata.evid}<br>M%{customdata.mag}<extra></extra>",
      marker: {symbol: c.symbol, color: c.color, size: ev.map(p.size),
               line: {color: c.color, width: c.symbol === "x" ? 0 : 1.3}},
    };
  });
}

function layout(p, d, el) {
  const narrow = el.clientWidth < 600;
  const line = (y, color, dash, width) => ({type:"line", xref:"paper", x0:0, x1:1, y0:y, y1:y,
                                            line:{color, dash, width}});
  const label = (y, text, color, opacity = 1) => ({xref:"paper", x:1.01, xanchor:"left", y:Math.log10(y),
                                                   text:`<i>${text}</i>`, showarrow:false,
                                                   font:{color, size:14}, opacity});
  return {
    title: {text: `<b>${d.system}</b> ${p.title} (agency=AK)`, font: {size: 20}},
    font: {family: '"Helvetica Neue","TeX Gyre Heros",Helvetica,Arial,sans-serif', size: 14, color: "#1a1a1a"},
    margin: narrow ? {l: 60, r: 70, t: 50, b: 50} : {l: 70, r: 80, t: 60, b: 60},
    xaxis: {showgrid: true, gridcolor: "#ccc", zeroline: false, nticks: narrow ? 4 : 10, tickangle: 0, ...p.xaxis},
    yaxis: {title: {text: "Detection Latency (s)"}, type: "log", range: [1, Math.log10(4800)],
            tickvals: [10, 20, 50, 100, 200, 500, 1000, 2000],
            showgrid: true, gridcolor: "#ccc", zeroline: false},
    legend: narrow
      ? {orientation: "h", x: 0, y: -0.18, yanchor: "top", font: {size: 13}}
      : {x: 1.01, xanchor: "left", y: 0, yanchor: "bottom", bordercolor: "#000", borderwidth: 1, font: {size: 13}},
    shapes: [
      {type:"rect", xref:"paper", x0:0, x1:1, y0:3600, y1:4800, fillcolor:"indigo", opacity:0.1, line:{width:0}, layer:"below"},
      line(120, "black", "solid", 1), line(300, "black", "solid", 1), line(900, "black", "solid", 1),
      line(3600, "indigo", "dash", 1.5),
    ],
    annotations: [label(120, "2 min", "black"), label(300, "5 min", "black"), label(900, "15 min", "black"),
                  label(3300, "60 min", "indigo"), label(4300, "60+ min", "indigo", 0.6)],
    hovermode: "closest", plot_bgcolor: "white", paper_bgcolor: "white",
  };
}

// Links to this event and to other plotted events on the same system within +-3 min of its origin time.
// Later events are listed above this event, earlier ones below.
const NEAR_S = 180;
const link = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>`;
function nearbyHtml(e, d) {
  e.t = e.t ?? Date.parse(e.time);
  const near = d.sorted.filter(o => Math.abs(o.t - e.t) <= NEAR_S * 1000);
  if (!near.some(o => o.evid === e.evid)) near.push(e);
  near.sort((a, b) => b.t - a.t);
  return near.map(o => {
    if (o.evid === e.evid) return `<li class="self">${link(e.url, `this event at ${e.time.slice(11, 19)}`)}</li>`;
    const dt = Math.round((o.t - e.t) / 1000);
    const name = CLASSES.find(c => c.key === o.class)?.name ?? "–";
    return `<li>${link(o.url, `${dt}, ${o.mag ?? "–"}, ${name}, ${o.author ?? "–"}`)}</li>`;
  }).join("");
}

function eventHtml(e, d) {
  const row = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
  const loc = e.lat == null ? "–" : `${e.lat.toFixed(3)}, ${e.lon.toFixed(3)}`;
  return `
    <h2>${esc(e.evid)}</h2>
    <dl>
      ${row("Origin time", esc(e.time.replace("T", " ").replace("Z", " UTC")))}
      ${row("First-origin latency", fmtLat(e.latency_s))}
      ${row("Magnitude", e.mag == null ? "–" : `${e.mag} ${esc(e.mag_type ?? "")}`)}
      ${row("Lat, lon", loc)}
      ${row("Depth", e.depth_km == null ? "–" : `${e.depth_km} km`)}
      ${row("Class", esc(CLASSES.find(c => c.key === e.class)?.name))}
      ${row("Mode / status", `${esc(e.mode)} / ${esc(e.status)}`)}
      ${row("Event type", esc(e.event_type))}
      ${row("Author", esc(e.author))}
      ${row("Phases used", esc(e.phases))}
      ${row("Azimuthal gap", e.gap == null ? "–" : `${e.gap}°`)}
      ${row("Origins", esc(e.n_origins))}
    </dl>
    <ul class="links">${nearbyHtml(e, d)}</ul>`;
}

function makeSection(p, i) {
  const node = document.getElementById("section-tpl").content.cloneNode(true);
  const sec = node.querySelector("section");
  sec.querySelector("h2.sec").textContent = p.heading;
  sec.querySelectorAll("input").forEach(r => r.name = `sys${i}`);
  document.getElementById("sections").appendChild(node);
  const el = sec.querySelector(".plot"), info = sec.querySelector("aside"), err = sec.querySelector(".error");
  info.innerHTML = HINT;
  let current = "onsite";

  async function draw(sys, keepInfo = false) {
    err.hidden = true;
    try {
      const d = await load(sys);
      document.getElementById("meta").textContent =
        `${d.start} to ${d.end} · generated ${d.generated} · AK-agency events in the mission region`;
      if (d.error) { err.textContent = `${sys}: ${d.error}`; err.hidden = false; }
      await Plotly.react(el, traces(p, d.events), layout(p, d, el), {responsive: true, displaylogo: false});
      if (!el._clickBound) { el.on("plotly_click", ev => info.innerHTML = eventHtml(ev.points[0].customdata, cache[current])); el._clickBound = true; }
      if (!keepInfo) info.innerHTML = HINT;
    } catch (e) {
      err.textContent = `Could not load ${sys}: ${e.message}`;
      err.hidden = false;
    }
  }
  sec.querySelectorAll("input").forEach(r => r.addEventListener("change", () => draw(current = r.value)));
  window.addEventListener("resize", () => { clearTimeout(el._rt); el._rt = setTimeout(() => draw(current, true), 250); });
  draw(current);
}

PLOTS.forEach(makeSection);
</script>
</body>
</html>
